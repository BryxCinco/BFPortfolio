<!doctype html>
<!-- Social preview card (1200x630). Render with scripts/og/render.mjs -> public/og-image.jpg -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,900&display=block" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@1&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #EEEFF3; font-family: Geist, sans-serif; color: #0B0B0C; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(11,11,12,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(11,11,12,.07) 1px, transparent 1px); background-size: 96px 96px; }
  .card { position: absolute; left: 40px; top: 40px; width: 760px; height: 550px; background: #F9F9FA; border: 1px solid rgba(11,11,12,.12); border-radius: 4px; padding: 44px 48px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px 0 14px; border-radius: 999px; background: #DDBCEB; color: #0E356C; font-weight: 600; font-size: 19px; }
  .pill i { width: 10px; height: 10px; background: #1F8A52; }
  .mono { font-family: 'Geist Mono', monospace; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; color: rgba(11,11,12,.68); }
  h1 { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; font-size: 106px; line-height: .86; letter-spacing: -.045em; text-transform: uppercase; }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; text-transform: none; font-size: 56px; letter-spacing: -.01em; color: #0F499A; margin-left: 6px; vertical-align: 12px; }
  .tag { display: flex; align-items: center; gap: 16px; font-family: 'Geist Mono', monospace; font-size: 20px; text-transform: uppercase; letter-spacing: .04em; }
  .tag b { width: 40px; height: 2px; background: #0B0B0C; }
  .sub { margin-top: 14px; font-size: 24px; line-height: 1.35; color: rgba(11,11,12,.75); max-width: 664px; }
  .photo { position: absolute; left: 820px; top: 40px; width: 340px; height: 550px; border-radius: 4px; overflow: hidden; background: #fff; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 18px; color: #fff; display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; background: linear-gradient(transparent, rgba(5,7,12,.65)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="card">
    <div class="top">
      <span class="pill"><i></i>Available for work · Manila</span>
      <span class="mono">Portfolio / Ed. 2026</span>
    </div>
    <h1>Brian Paul<br />Francisco<em>(dev)</em></h1>
    <div>
      <div class="tag"><b></b>Full-Stack LLM Developer</div>
      <p class="sub">Full-stack developer from Manila building AI-powered web and mobile apps.</p>
    </div>
  </div>
  <div class="photo">
    <img src="../../src/assets/hero/brian-1.webp" alt="" />
    <div class="cap"><span>B. P. Francisco</span><span>Fig. 01</span></div>
  </div>
</body>
</html>
