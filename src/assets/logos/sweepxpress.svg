<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A3D"/>
      <stop offset="0.55" stop-color="#1B3A8A"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#34D399"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#shine)"/>

  <g stroke-linecap="round" stroke="#A7F3D0">
    <line x1="120" y1="400" x2="320" y2="400" stroke-width="30" opacity="0.9"/>
    <line x1="180" y1="490" x2="310" y2="490" stroke-width="30" opacity="0.65"/>
    <line x1="100" y1="580" x2="290" y2="580" stroke-width="30" opacity="0.45"/>
  </g>

  <path d="M140 770 C 360 880, 700 870, 890 650" fill="none" stroke="url(#swoosh)" stroke-width="60" stroke-linecap="round"/>
  <polygon points="944,586 860,624 920,688" fill="#A7F3D0"/>

  <g filter="url(#shadow)" transform="translate(575 470)">
    <polygon points="0,-230 200,-115 0,0 -200,-115" fill="url(#top)"/>
    <polygon points="-200,-115 0,0 0,230 -200,115" fill="url(#left)"/>
    <polygon points="200,-115 0,0 0,230 200,115" fill="url(#right)"/>
    <polygon points="-100,-172 100,-57 140,-80 -60,-195" fill="#10B981"/>
    <polygon points="100,-57 140,-80 140,150 100,173" fill="#059669"/>
    <g stroke="#1B3A8A" stroke-width="24" stroke-linecap="round" transform="translate(-100 58) skewY(30)">
      <line x1="-40" y1="-46" x2="40" y2="46"/>
      <line x1="40" y1="-46" x2="-40" y2="46"/>
    </g>
  </g>
</svg>